<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas</title>
<meta name="description" content="Atlas turns Ukrainian and Russian official daily war reports into a ledger of claims, each tied to its evidence by character offsets.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bone: #e6dfcf;
    --ink: #111;
    --red: #b3261e;
    --muted: rgba(17, 17, 17, .5);
    --faint: rgba(17, 17, 17, .14);
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bone); color: var(--ink); overflow: hidden;
    -webkit-font-smoothing: antialiased; }
  body { font-family: var(--mono); }
  @media (pointer: fine) { body, a { cursor: none; } }

  canvas#line { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; }

  /* paper grain */
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 30;
    background: repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,0,0,.012) 2px 4px); }

  .cursor { position: fixed; width: 6px; height: 6px; background: var(--red); border-radius: 50%;
    pointer-events: none; z-index: 50; transform: translate(-50%, -50%); }
  .cursor-ring { position: fixed; width: 30px; height: 30px; border: 1px solid rgba(17,17,17,.3);
    border-radius: 50%; pointer-events: none; z-index: 49; transform: translate(-50%, -50%);
    transition: width .2s, height .2s, border-color .2s; }
  .cursor-ring.hot { width: 46px; height: 46px; border-color: var(--red); }
  @media (pointer: coarse) { .cursor, .cursor-ring { display: none; } }

  .bracket { position: fixed; width: 28px; height: 28px; border: 0 solid var(--faint); z-index: 20; }
  .tl { top: 24px; left: 24px; border-width: 1px 0 0 1px; }
  .tr { top: 24px; right: 24px; border-width: 1px 1px 0 0; }
  .bl { bottom: 24px; left: 24px; border-width: 0 0 1px 1px; }
  .br { bottom: 24px; right: 24px; border-width: 0 1px 1px 0; }

  .label { position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
    font-size: 9px; letter-spacing: .18em; text-transform: uppercase; white-space: nowrap; }
  .classify { top: 24px; color: var(--muted); border: 1px solid var(--faint); padding: 3px 12px; }
  .timestamp { bottom: 24px; color: rgba(17,17,17,.35); letter-spacing: .1em; }

  .stage { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 44px; padding: 0 16px; text-align: center;
    pointer-events: none; }
  .anim .stage { animation: stageIn 1.4s cubic-bezier(.16,1,.3,1) both; }
  .stage a { pointer-events: auto; }
  @keyframes stageIn { from { opacity: 0; transform: scale(.97); } to { opacity: 1; transform: none; } }

  .anim .wordmark { animation: wordIn .9s .5s cubic-bezier(.16,1,.3,1) both; }
  .wordmark h1 { font-family: "Times New Roman", Times, serif; font-weight: 700;
    font-size: clamp(72px, 17vw, 200px); line-height: .9; letter-spacing: .06em; color: var(--ink);
    padding-left: .06em; }
  .wordmark p { font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    color: var(--muted); margin-top: 18px; }
  .wordmark p.by { font-size: 9px; letter-spacing: .18em; margin-top: 8px; color: rgba(17,17,17,.4); }
  .wordmark p .r { color: var(--red); }
  @keyframes wordIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .anim .actions { animation: wordIn .9s 1.2s cubic-bezier(.16,1,.3,1) both; }
  .btn { display: inline-flex; align-items: center; gap: 12px; padding: 11px 30px;
    border: 1px solid rgba(17,17,17,.25); color: var(--ink); background: rgba(230,223,207,.7);
    font-family: var(--mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
    text-decoration: none; transition: all .25s; }
  .btn:hover, .btn:focus-visible { border-color: var(--red); color: var(--red);
    background: rgba(179,38,30,.06); outline: none; }
  .btn.ghost { border-color: transparent; color: var(--muted); background: transparent; }
  .btn.ghost:hover, .btn.ghost:focus-visible { border-color: transparent; }
  .arrow { transition: transform .25s; font-size: 14px; }
  .btn:hover .arrow { transform: translateX(4px); }

  .figures { display: flex; gap: 28px; justify-content: center; flex-wrap: wrap;
    font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .anim .figures { animation: wordIn .9s 1.6s cubic-bezier(.16,1,.3,1) both; }
  .figures b { display: block; font-family: "Times New Roman", Times, serif; font-size: 22px;
    letter-spacing: .02em; font-weight: 700; color: var(--ink); margin-bottom: 2px;
    font-variant-numeric: tabular-nums; }

  @media (max-width: 520px) {
    .bracket { display: none; }
    .stage { gap: 32px; }
    .figures { gap: 18px; }
  }
</style>
</head>
<body>
<canvas id="line" aria-hidden="true"></canvas>
<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="ring"></div>
<div class="bracket tl"></div><div class="bracket tr"></div>
<div class="bracket bl"></div><div class="bracket br"></div>
<div class="label classify">OSINT · Open data · Claims, not facts</div>
<div class="label timestamp" id="ts"></div>

<main class="stage">
  <div class="wordmark">
    <h1>Atlas</h1>
    <p>A ledger of battlefield <span class="r">claims</span></p>
    <p class="by">Francisco Pecora</p>
  </div>
  <div class="actions">
    <a class="btn" href="map.html"><span>Open the map</span><span class="arrow">→</span></a>
    <a class="btn ghost" href="https://github.com/FranciscoPecora/claimline"><span>Method and results</span></a>
  </div>
  <div class="figures" id="figures" hidden>
    <div><b id="f-events">–</b>events</div>
    <div><b id="f-reports">–</b>daily reports</div>
    <div><b>3</b>official sources</div>
  </div>
</main>

<script>
(() => {
  const canvas = document.getElementById("line");
  const ctx = canvas.getContext("2d");
  const cursor = document.getElementById("cursor");
  const ring = document.getElementById("ring");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const RED = getComputedStyle(document.documentElement).getPropertyValue("--red").trim();

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener("resize", resize);

  // The line is a rope: the head eases towards the pointer, every other node keeps a
  // fixed distance from the one before it, so the body trails behind like a drawn front line.
  const N = 90, SEG = 7, GAP = 8;
  const nodes = Array.from({ length: N }, (_, i) => ({ x: W * 0.15 - i * SEG, y: H * 0.62 }));
  let tx = W / 2, ty = H / 2, rx = tx, ry = ty, lastMove = -1e9, t = 0;

  addEventListener("pointermove", e => {
    tx = e.clientX; ty = e.clientY; lastMove = performance.now();
    cursor.style.left = tx + "px"; cursor.style.top = ty + "px";
  });
  document.querySelectorAll("a").forEach(a => {
    a.addEventListener("pointerenter", () => ring.classList.add("hot"));
    a.addEventListener("pointerleave", () => ring.classList.remove("hot"));
  });

  function step() {
    t += 0.008;
    // With no pointer for two seconds, the head wanders on a slow figure of eight.
    if (performance.now() - lastMove > 2000) {
      tx = W / 2 + Math.sin(t) * W * 0.34;
      ty = H / 2 + Math.sin(t * 2) * H * 0.22;
    }
    const head = nodes[0];
    head.x += (tx - head.x) * 0.14;
    head.y += (ty - head.y) * 0.14;
    for (let i = 1; i < N; i++) {
      const a = nodes[i - 1], b = nodes[i];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      if (d > SEG) { b.x = a.x + dx / d * SEG; b.y = a.y + dy / d * SEG; }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = RED;
    // Walk the polyline and drop a dot every GAP pixels, fading towards the tail.
    let carry = 0, k = 0;
    const total = (N - 1) * SEG;
    for (let i = 1; i < N; i++) {
      const a = nodes[i - 1], b = nodes[i];
      const len = Math.hypot(b.x - a.x, b.y - a.y);
      for (let s = carry; s < len; s += GAP) {
        const f = s / (len || 1), along = (k * GAP) / total;
        ctx.globalAlpha = Math.max(0, 1 - along * 0.85);
        ctx.beginPath();
        ctx.arc(a.x + (b.x - a.x) * f, a.y + (b.y - a.y) * f, 2.1 - along * 0.9, 0, Math.PI * 2);
        ctx.fill();
        k++;
      }
      carry = (carry - len) % GAP; if (carry < 0) carry += GAP;
    }
    ctx.globalAlpha = 1;
  }

  function frame() {
    step(); draw();
    rx += (tx - rx) * 0.12; ry += (ty - ry) * 0.12;
    ring.style.left = rx + "px"; ring.style.top = ry + "px";
    requestAnimationFrame(frame);
  }

  if (still) {
    // Settle the rope along a gentle curve and draw it once.
    nodes.forEach((n, i) => { n.x = W * 0.12 + i * SEG * 1.0; n.y = H * 0.7 + Math.sin(i / 9) * 18; });
    draw();
    addEventListener("resize", draw);
  } else {
    // Entrance animations start only once frames run, so the text is never stuck hidden.
    requestAnimationFrame(() => {
      document.documentElement.classList.add("anim");
      requestAnimationFrame(frame);
    });
    // By 3 s every entrance has finished; dropping the class then changes nothing on
    // screen, and shows the text anyway where animations were paused.
    setTimeout(() => document.documentElement.classList.remove("anim"), 3000);
  }

  const ts = document.getElementById("ts");
  const tick = () => { ts.textContent = new Date().toUTCString().replace("GMT", "UTC"); };
  tick(); setInterval(tick, 1000);

  // Headline numbers come from the same meta.json the map reads.
  fetch("data/meta.json").then(r => r.ok ? r.json() : null).then(m => {
    if (!m) return;
    const fmt = n => n.toLocaleString("en-GB");
    document.getElementById("f-events").textContent = fmt(m.n_events);
    document.getElementById("f-reports").textContent = fmt(m.n_reports);
    document.getElementById("figures").hidden = false;
  }).catch(() => {});
})();
</script>
</body>
</html>
