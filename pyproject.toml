[project]
name = "atlas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.9.0",
    "beautifulsoup4>=4.15.0",
    "duckdb>=2.0.0",
    "gliner2[local]>=2.1.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "polars>=2.1.0",
    "protobuf>=7.36.2",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "scikit-learn>=1.9.1",
    "sentencepiece>=0.2.3",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
