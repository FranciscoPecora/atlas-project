# Claimline configuration. Every eval run logs these values and their hash.
# Model IDs, effort and thresholds live here only. No model ID in code.

corpus:
  start: 2026-07-19
  end: 2026-11-15
  analysis_end: 2026-10-16

collect:
  delay_seconds: 3
  timeout_seconds: 30
  user_agent: "claimline-research/0.1 (non-commercial research)"
  isw:
    # Off until ISW grants written permission (docs/permissions.md).
    enabled: false
    url_template: "https://understandingwar.org/research/russia-ukraine/russian-offensive-campaign-assessment-{month}-{day}-{year}/"
  gsu:
    enabled: true
    sitemap_template: "https://armyinform.com.ua/sitemap-posttype-post.{yyyymm}.xml"
    # Slugs vary by day. Candidates are that day's posts whose slug contains a
    # keyword, tried tier by tier until one body states the 08:00 cutoff.
    slug_keyword_tiers:
      - ["zitkn", "boyezitkn", "boyiv", "za-dobu-na-fronti", "za-mynulu-dobu"]
      - ["genshtab"]
      - ["atak", "napryamk"]
    # Inflection varies ("Оперативна інформація", "з оперативною інформацією"),
    # and so does the hour ("08:00", "8:00", "08.00").
    # Up to 8 words may stand between ("в оперативній інформації Генерального
    # штабу ЗС України станом на 8:00"). The 08:00 itself is required (SPEC 1).
    cutoff_pattern: "(?i)оперативн\\w*\\s+інформаці\\w*(?:\\s+[^\\s.]+){0,8}?\\s+станом\\s+на\\s+0?8[:.]00"
  # SPEC amendment A2. Air Force overnight air-attack report, same ArmyInform sitemaps.
  af:
    enabled: true
    slug_keyword_tiers:
      - ["povitryani-syly", "povitryanyh-syl"]
      - ["udarnyh-bpla", "bpla-zi-", "bpla-ta-", "-bpla", "bezpilotnykiv", "raket"]
      - ["vnochi", "u-nich", "nichn"]
    # The body must name the night and the Air Force (any inflection).
    body_pattern: "(?is)(?=.*у\\s+ніч\\s+на\\s+\\d{1,2}\\s+\\w+)(?=.*повітрян\\w+\\s+сил)"
  # SPEC amendment A2. Russian MoD public Telegram channel, read through its web preview.
  rumod:
    enabled: true
    channel_url: "https://t.me/s/mod_russia"
    post_url: "https://t.me/mod_russia/{id}"
    utc_offset_hours: 3
    # A post enters the day's report when its text matches (claims, not ceremonies).
    claim_pattern: "(?i)освобод|под\\s+контроль|ПВО|перехвач|сбит|главное\\s+за\\s+день|нанес\\w*\\s+(?:массированн\\w+\\s+|групповой\\s+)?удар|поражени\\w+|группировк\\w+\\s+войск"

models:
  # Baseline B1 entity models (SPEC.md section 6), run locally.
  b1_gliner_en: fastino/gliner2-base-v1
  b1_gliner_uk: fastino/gliner2-multi-v1
  b1_threshold: 0.5
  # Check https://platform.claude.com/docs/en/models/overview for dated snapshot
  # IDs before the first API call (milestone 3) and pin them here if listed.
  extraction: claude-haiku-5-5
  extraction_effort: low
  # Second effort level tried on dev (PLAN section 5: test low against medium).
  extraction_effort_alt: medium
  verifier: claude-haiku-5-5
  verifier_alt: claude-sonnet-5-5
  verifier_effort: low
  geocode_disambiguation: claude-sonnet-5-5
  # Annotator reading aid for Ukrainian dev reports (src/translate.py). A larger
  # model than the extractor, so the aid does not share the extractor's errors.
  translation: claude-opus-5-5
  translation_effort: medium
  # Reviewer that turns rule pre-fills into the GSU answer key (src/review.py).
  # Larger than the extraction model, so it is not the system under test.
  gold_review: claude-opus-5-5
  gold_review_effort: high

eval:
  match_km: 10
  match_days: 1
  grid_km: [5, 10, 25]
  grid_days: [0, 1, 2]
  bootstrap_resamples: 2000
  seed: 20261116

prelabel:
  # Rule-based pre-fill for GSU dev units (src/prelabel.py). Not for test units.
  # Anchoring check: these paragraphs of this report are labelled first, from
  # scratch, as a separate CONTROL task; the same paragraphs are later checked
  # with pre-fills. Agreement between the two is reported against the target.
  control_report: 2026-08-06
  control_paragraphs: [6, 7]
  agreement_target: 0.9

link:
  duplicate_km: 5
  duplicate_days: 3
  confirmation_days: 30
  report_windows_days: [7, 14, 30]

cost:
  # ECB reference rate of 2026-11-17 (latest published on 18 November): 1 EUR = 1.0989 USD.
  eur_per_usd: 0.9100

# USD per million tokens, checked 2026-11-16 (PLAN section 5). Cache write is
# 1.25 times and cache read 0.1 times the input price.
prices:
  claude-haiku-5-5: {input: 0.10, output: 0.50, cache_write: 0.125, cache_read: 0.01}
  # Added 2026-11-19 from the claude-api model table: Sonnet 5.5 cache reads are 0.10
  # (not 0.1 times input), Opus 5.5 cache reads 0.20.
  claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_write: 2.50, cache_read: 0.10}
  claude-opus-5-5: {input: 4.00, output: 20.00, cache_write: 5.00, cache_read: 0.20}

verify:
  # Model field verifier (src/verify_model.py): one call per distinct evidence quote.
  max_tokens: 8000
  timeout_seconds: 300

extract:
  max_tokens: 32000
  timeout_seconds: 900
  # Worked examples in the extraction prompt: these paragraphs of this dev
  # report, with the events the dev key holds for them. Paragraphs 3 and 17
  # have no events. Dev scores are also reported without this report.
  example_report: 2026-07-21
  example_paragraphs: [3, 5, 6, 8, 17]

audit:
  # Spot check of the machine-made GSU answer key (src/audit.py, amendment A1).
  events: 30
  paragraphs: 10
  max_error_rate: 0.05
  # Round 1 was void: the page did not say that a count shared by several places
  # is left out on purpose, so correct events were marked wrong (DECISIONS.md).
  # Round 3 is extra, not required by A1: round 2 accepted the key, but 30 events
  # leave a 95% interval up to 16.7%. Round 3 adds items that round 2 did not hold.
  round: 3
  test_round: 1
  extra_rounds:
    3: {events: 100, paragraphs: 20, skip_rounds: [2]}

geocode:
  # General Staff front directions and the town each is named after, as
  # [Ukrainian name, GeoNames oblast]. Used only to choose between same-named
  # places (the nearest to the direction's town wins); never as coordinates of
  # an event. The Slobozhanskyi and Kursk directions are named after regions,
  # and Oleksandrivka has many namesakes, so those anchors are approximate.
  direction_anchors:
    Північно-Слобожанський: ["Суми", "Sumy"]
    Курський: ["Суми", "Sumy"]
    Південно-Слобожанський: ["Харків", "Kharkiv"]
    Куп’янський: ["Куп’янськ", "Kharkiv"]
    Лиманський: ["Лиман", "Donetsk"]
    Слов’янський: ["Слов’янськ", "Donetsk"]
    Сіверський: ["Сіверськ", "Donetsk"]
    Краматорський: ["Краматорськ", "Donetsk"]
    Костянтинівський: ["Костянтинівка", "Donetsk"]
    Торецький: ["Торецьк", "Donetsk"]
    Покровський: ["Покровськ", "Donetsk"]
    Новопавлівський: ["Новопавлівка", "Dnipropetrovsk"]
    Олександрівський: ["Олександроград", "Donetsk"]
    Гуляйпільський: ["Гуляйполе", "Zaporizhzhia"]
    Оріхівський: ["Оріхів", "Zaporizhzhia"]
    Придніпровський: ["Херсон", "Kherson"]
  # A candidate farther than this from its direction's town is not trusted.
  max_anchor_km: 120

gold:
  # SPEC 4.1: "If a sampled report is missing from the corpus: take the next
  # available date for that source and log it." The posts of 22 and 30 August
  # do not state the 08:00 cutoff, so they are not reports under SPEC section 1.
  substitutions:
    gsu-2026-08-22: 2026-08-25
    gsu-2026-08-30: 2026-08-31

field_audit:
  # Unsupported-field audit (SPEC 5.3, src/audit_fields.py): records drawn from S2
  # output of the dev-period General Staff reports that are not gold units.
  records: 200
  seed: 20261119
  translate_chunk: 40

units:
  # Unit alias matching (src/units.py): rapidfuzz token_set_ratio threshold.
  fuzzy_min: 85

geocode_check:
  # Hand check of the geocoder on dev places (src/geocode_check.py), not the SPEC metric.
  places: 50
  seed: 20261119

batch:
  # Message Batches API (src/batch.py): half the per-token price, results within 24 h.
  price_factor: 0.5
  poll_seconds: 60
  retries: 2

ledger:
  # The system whose output is the published ledger (README: S3-H ships, SPEC section 6).
  system: S3-H
  # Run on the test reports only, so `make eval-test` can score every system.
  test_only_systems: [B2, S3-S]

viina:
  # VIINA 2.0 (Zhukov and Ayers), Open Database License. One-event-per-place-per-day
  # file, pinned to the Git LFS object fetched on 2026-11-19 (release bert_20261116).
  repo: zhukovyuri/VIINA
  file: event_1pd_latest_2026.zip
  oid: 286f6ca641970ee2522436f808c7245715f194f27c9f5608b8e1e8ecb4c9b8ac
  size: 763704
  # VIINA ADM1_NAME -> gazetteer oblast (src/gazetteer.py, GeoNames admin1 names).
  oblast_names:
    Cherkasy: Cherkasy
    Chernihiv: Chernihiv Oblast
    Chernivtsi: Chernivtsi
    Crimea: Crimea
    "Dnipropetrovs'k": Dnipropetrovsk
    "Donets'k": Donetsk
    "Ivano-Frankivs'k": Ivano-Frankivsk
    Kharkiv: Kharkiv
    Kherson: Kherson
    "Khmel'nyts'kyy": Khmelnytskyi
    Kiev: Kyiv Oblast
    Kiev City: Kyiv City
    Kirovohrad: Kirovohrad
    "L'viv": Lviv
    "Luhans'k": Luhansk
    Mykolayiv: Mykolaiv
    Odessa: Odesa
    Poltava: Poltava
    Rivne: Rivne Oblast
    "Sevastopol'": Sevastopol City
    Sumy: Sumy
    "Ternopil'": Ternopil
    Transcarpathia: Zakarpattia
    Vinnytsya: Vinnytsia
    Volyn: Volyn
    Zaporizhzhya: Zaporizhzhia
    Zhytomyr: Zhytomyr Oblast

# Static demo (milestone 6). PLAN: 48-hour delay on any map of conflict events.
site: {delay_hours: 48}
